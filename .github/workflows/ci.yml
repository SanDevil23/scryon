name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────
  # Job 1: Lint
  # ────────────────────────────────────────────
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.28.1"

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b $(go env GOPATH)/bin v2.12.2
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Check generated proto files are up to date
        run: make proto-check

      - name: Lint all modules
        run: make lint

  # ────────────────────────────────────────────
  # Job 2: Unit tests
  # ────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run unit tests
        run: go test -race -count=1 -timeout=60s ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
        if: always()

  # ────────────────────────────────────────────
  # Job 3: Integration tests
  # ────────────────────────────────────────────
  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run integration tests
        run: go test -tags=integration -race -count=1 -timeout=120s ./...
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # ────────────────────────────────────────────
  # Job 4: Build all services
  # ────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build all services
        run: |
          go build ./services/ingest/...
          go build ./services/processor/...

      - name: Verify no uncommitted changes
        run: git diff --exit-code