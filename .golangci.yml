version: "2"

run:
  timeout: 5m
  go: "1.26"

linters:
  default: none

  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - noctx
    - bodyclose
    - exhaustive
    - gocritic

  settings:
    errcheck:
      check-blank: true

    misspell:
      locale: US

    godot:
      scope: declarations

  exclusions:
    rules:
      - path: "gen/"
        linters:
          - all

      - path: "_test\\.go"
        linters:
          - errcheck
          - godot

issues:
  max-issues-per-linter: 50
  max-same-issues: 10

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/sandevil23/scryon